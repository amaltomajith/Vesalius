# Vesalius CI: every push and pull request.
#   python       ruff, mypy, the unit tests (no Postgres/MinIO/tesseract needed)
#   viewer       tsc + vitest + the production build of the app
#   integration  the integration, OCR and proof tests, in the real api image against real
#                Postgres + MinIO (docker compose --profile test), exactly as run locally
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # a public repository: nothing secret and no medical image may ever be committed
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No keys, no scans
        run: |
          set -e
          bad=0
          if git grep -nIE 'gsk_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::a key is committed"; bad=1
          fi
          if git ls-files | grep -iE '\.(dcm|nii|nii\.gz|nrrd|mha)$|(^|/)\.env$|^secrets/[^.]|^sample_data/|^real_scans/'; then
            echo "::error::a scan, .env or secret file is committed"; bad=1
          fi
          exit $bad
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy src
      - run: pytest -q -m "not integration and not ocr"

  viewer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the api image is ~5 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Throwaway .env and secrets (fresh random values, never stored)
        run: bash scripts/setup-demo.sh
      - name: Integration, OCR and proof tests
        run: docker compose --profile test run --rm test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose --profile test down -v

  # the arm64 api image the server pulls (DEPLOY.md): GitHub's free native arm64 runner (public
  # repositories), pushed to ghcr.io only from main, and only after it passes a smoke test
  image:
    runs-on: ubuntu-24.04-arm
    needs: [hygiene, python, viewer]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the runner has 14 GB; the image is ~5 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          platforms: linux/arm64
          load: true
          tags: vesalius-api:ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/vesalius-api:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}/vesalius-api:buildcache,mode=max', github.repository_owner) || '' }}
      - name: Smoke test (every heavy dependency imports on arm64; the unit tests pass in the image)
        run: |
          docker run --rm --entrypoint sh vesalius-api:ci -c "
            python -c 'import torch, torchvision, totalsegmentator, SimpleITK, fast_simplification, pydicom, pytesseract, trimesh, skimage; print(\"torch\", torch.__version__, torch.backends.cpu.get_cpu_capability())' &&
            tesseract --version | head -1 &&
            python -m pytest -q -m 'not integration and not ocr' tests/unit"
      - name: Push to ghcr.io (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          for tag in latest "${GITHUB_SHA::12}"; do
            docker tag vesalius-api:ci "ghcr.io/$OWNER/vesalius-api:$tag"
            docker push "ghcr.io/$OWNER/vesalius-api:$tag"
          done

