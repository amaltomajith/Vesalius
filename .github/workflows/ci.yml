# Phantom CI: every push and pull request.
#   python       ruff, mypy, the unit tests (no Postgres/MinIO/tesseract needed)
#   viewer       tsc + vitest + the production build of the app
#   integration  the integration, OCR and proof tests, in the real api image against real
#                Postgres + MinIO (docker compose --profile test), exactly as run locally
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy src
      - run: pytest -q -m "not integration and not ocr"

  viewer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the api image is ~5 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Throwaway .env and secrets (fresh random values, never stored)
        run: bash scripts/setup-demo.sh
      - name: Integration, OCR and proof tests
        run: docker compose --profile test run --rm test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose --profile test down -v
