# The static site on GitHub Pages (DEPLOY.md, part A): https://<owner>.github.io/<repo>/
#   the landing page, the app in static mode (viewer, `vite build --mode pages`), the full-body
#   atlas, and the exported studies and proof results. Free and always on; no server.
#
#   data  rebuilds the exported studies from public sources by running the pipeline here: the
#         compose stack, the three public CTs (scripts/load_demo_studies.py), every proof
#         (scripts/record_proofs.py; proof 5 must pass), then scripts/export_static.py, which reads
#         only the gold serving routes and refuses anything unsafe. Published as the asset of the
#         `static-data` release, never committed. Manual: Actions > pages > Run workflow, with
#         "rebuild the exported studies" ticked (~1 hour).
#   site  every push to main: builds the site around the latest data asset and deploys it.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_data:
        description: Rebuild the exported studies (runs the pipeline on the public CTs, ~1 hour)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  data:
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_data
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write # the static-data release
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the api image is ~5 GB, the segmentation weights ~1.5 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Throwaway .env and secrets (fresh random values, never stored)
        run: bash scripts/setup-demo.sh
      - name: Start the stack and wait until it is ready
        run: |
          docker compose up -d --build
          port="$(grep -E '^DEMO_PORT=' .env | cut -d= -f2)"; port="${port:-8000}"
          echo "API=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          for _ in $(seq 1 120); do
            curl -fsS "http://127.0.0.1:$port/health/ready" && exit 0
            sleep 5
          done
          exit 1
      - name: Run the three public CT studies through the pipeline
        run: docker compose exec -T api python scripts/load_demo_studies.py
      - name: Run every proof (proof 5 must pass)
        run: python3 scripts/record_proofs.py --api "$API"
      - name: Export the served gold
        run: |
          python3 scripts/export_static.py --api "$API" --out site-data
          tar -czf site-data.tar.gz -C site-data .
          du -sh site-data
      - name: Publish as the static-data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Exported studies and proof results for the static site, built by the pages workflow from public sources (credits in each study's CREDIT.txt). Commit ${GITHUB_SHA::12}."
          gh release view static-data >/dev/null 2>&1 || gh release create static-data --title "Static site data" --notes "$notes" --latest=false
          gh release edit static-data --notes "$notes"
          gh release upload static-data site-data.tar.gz --clobber
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v

  site:
    needs: data
    if: always() && (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build the app in static mode
        working-directory: viewer
        env:
          VITE_BASE: /${{ github.event.repository.name }}/app/
        run: |
          npm ci
          npm run build -- --mode pages
      - name: Assemble the site (scripts/build_pages_site.sh)
        env:
          GH_TOKEN: ${{ github.token }}
          WAKE_URL: ${{ vars.WAKE_URL }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if gh release download static-data -p site-data.tar.gz -D /tmp/data; then
            mkdir -p /tmp/site-data && tar -xzf /tmp/data/site-data.tar.gz -C /tmp/site-data
            bash scripts/build_pages_site.sh site /tmp/site-data
          else
            echo "::warning::no static-data release yet: run this workflow with 'rebuild the exported studies'"
            bash scripts/build_pages_site.sh site
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
