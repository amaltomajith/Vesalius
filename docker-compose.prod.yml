# Production overlay for the public showcase (see DEPLOY.md). Always used together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What it changes:
#   - Caddy is the only service with host ports (80/443); postgres, minio and the api lose theirs.
#   - VESALIUS_PUBLIC=1: visitors can look, only the admin can upload, run or prove (src/api/auth.py).
#   - Presigned gold URLs are signed for https://files.<domain>, which Caddy proxies to MinIO.
#   - restart policies, memory limits, log rotation. Sized for Oracle's Always Free A1 as it is
#     since 15 June 2026: 2 OCPU / 12 GB (was 4 / 24). Caddy 256m + postgres 1g + minio 1g + api 8g,
#     leaving ~1.5 GB for the OS, plus 4 GB swap (setup-server.sh). One heavy job at a time
#     (api/demo_state.HEAVY_LOCK), so one segmentation is the peak.
# `!reset` needs Docker Compose v2.24+ (installed by scripts/deploy/setup-server.sh).

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      VESALIUS_DOMAIN: "${VESALIUS_DOMAIN:?set VESALIUS_DOMAIN in .env}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    <<: *logging

  postgres:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 1g
    <<: *logging

  minio:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 1g
    <<: *logging

  minio-init:
    <<: *logging

  migrate:
    <<: *logging

  api:
    # the arm64 image CI builds on GitHub's free arm64 runners (.github/workflows/ci.yml, job
    # `image`); scripts/deploy/deploy.sh pulls it (or builds it here with --build: 2 A1 cores are slow)
    image: "${VESALIUS_IMAGE:?set VESALIUS_IMAGE in .env, e.g. ghcr.io/<you>/vesalius-api}:${VESALIUS_TAG:-latest}"
    ports: !reset []
    restart: unless-stopped
    # --proxy-headers: the login rate limit is per client IP, and behind Caddy every request would
    # otherwise come from Caddy's address. Trusting any forwarder is safe only because the api has
    # no host port: Caddy is the one thing that can reach it.
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      VESALIUS_PUBLIC: "1"
      VESALIUS_ADMIN_PASSWORD_HASH: "${VESALIUS_ADMIN_PASSWORD_HASH:?set it with scripts/deploy/setup-server.sh}"
      VESALIUS_SESSION_SECRET: "${VESALIUS_SESSION_SECRET:?set VESALIUS_SESSION_SECRET in .env}"
      MINIO_PUBLIC_ENDPOINT: files.${VESALIUS_DOMAIN}
      MINIO_PUBLIC_SECURE: "true"
    # S8 (TotalSegmentator) peaks around 8 GB; the VM has 12 GB and 4 GB swap. Measured on the VM
    # after the first deploy (DEPLOY.md).
    mem_limit: 8g
    memswap_limit: 11g
    <<: *logging

volumes:
  caddy_data: {}
  caddy_config: {}
